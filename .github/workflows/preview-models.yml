name: CI Preview Models

on:
  push:
    branches: ['**']
    paths:
      - 'preview-models/**'
      - '.github/workflows/preview-models.yml'
  pull_request:
    paths:
      - 'preview-models/**'
      - '.github/workflows/preview-models.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preview-models
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: preview-models/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
