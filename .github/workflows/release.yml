name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    env:
      WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm compile

      - name: Build Chrome (zip)
        run: pnpm zip

      - name: Build Firefox (zip)
        run: pnpm zip:firefox
        
      - name: Sign Firefox package (AMO, optional)
        if: ${{ env.WEB_EXT_API_KEY != '' }}
        run: >
          pnpm exec web-ext sign
          --source-dir .output/firefox-mv2
          --channel unlisted
          --artifacts-dir .output/signed

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-sources.zip
            .output/signed/*.xpi
