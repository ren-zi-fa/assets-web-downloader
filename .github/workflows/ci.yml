name: CI

on:
  push:
    branches: ['**']
    # Lewati run kalau yang berubah hanya file non-kode (dokumentasi, gambar, lisensi).
    paths-ignore: &non-code-paths
      - '**.md'
      - 'docs/**'
      # Project Vite terpisah, punya workflow CI sendiri.
      - 'preview-models/**'
      - 'images/**'
      - 'LICENSE'
      # Skill vendored dari sumber eksternal, bukan kode project.
      - '.agents/**'
  pull_request:
    paths-ignore: *non-code-paths

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm compile

      - name: Test
        run: pnpm test

      - name: Build Chrome (zip)
        run: pnpm zip

      - name: Build Firefox (zip)
        run: pnpm zip:firefox

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: asset-downloader-packages
          # `.output` ada di .gitignore; tanpa ini upload-artifact mengabaikannya.
          include-hidden-files: true
          path: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-sources.zip
          if-no-files-found: error
          retention-days: 14
